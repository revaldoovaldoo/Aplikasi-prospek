name: Corporate Robot 24/7

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/corporate-robot.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: corporate-robot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one Corporate Robot batch
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --silent --show-error --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hallo-pane-robot")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "GitHub tidak memberikan OIDC token."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 \
            -X POST "https://site-112732548e6d4039b0803f571aea6817.freebuff.page/api/corporate/robot/cron-oidc" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-oidc"}'
